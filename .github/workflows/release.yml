name: Release

# Zenodo archives a repository when GitHub publishes a release, minting a DOI
# for that snapshot. Pushing a tag is enough to trigger it; the release itself
# is created here so no manual step is needed at tag time.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build release notes from the dataset
        id: notes
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          sys.path.insert(0, 'scripts')
          import common
          d = common.load_data()
          r = d.get('date_range', {})
          sources = len({c.get('source') for c in d['cases']})
          academic = sum(1 for c in d['cases'] if c.get('source_type') == 'academic')
          print('body<<EOF')
          print(f"Snapshot of the AI Psychosis Watch dataset.\n")
          print(f"- **{d['total_cases']}** cases ({academic} academic) from **{sources}** sources")
          print(f"- Coverage: {r.get('from', '?')} to {r.get('to', '?')}")
          print(f"- Generated: {d.get('generated_at', '?')}\n")
          print("Entries document reports, not verified diagnoses, and counts reflect "
                "coverage rather than incidence. See "
                "https://aipsychosis.watch/methodology.html")
          print('EOF')
          PY

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${{ steps.notes.outputs.body }}" \
            data.json feed.xml excluded.json
