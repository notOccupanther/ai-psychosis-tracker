name: Release

# Zenodo archives a repository when GitHub publishes a release, minting a DOI
# for that snapshot. Pushing a v* tag is enough; the release is created here so
# there is no manual step at tag time.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Written to a file rather than a step output: release notes are
      # multi-line, and interpolating them into a shell command breaks on any
      # quote or newline in the data.
      - name: Build release notes from the dataset
        run: python scripts/release_notes.py > RELEASE_NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            data.json feed.xml excluded.json \
            --title "$GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
